name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04 # a new image is a commit of its own; see ci.yml
    env:
      # The meeting point baked into every client this job builds, peer ID
      # and all, unless the FT_SERVER repository variable names another.
      FT_SERVER: ${{ vars.FT_SERVER || '/dns4/rendezvous.madebybaki.com/tcp/443/tls/ws/p2p/12D3KooWJdXaT1FN4UGLCrrTpdqvpo7cqrJZK6tHvbUPQbJ6APtK' }}
      # Where copies of the client look when the server has moved.
      # Set the FT_SERVER_LIST variable to override the landing page.
      FT_SERVER_LIST: ${{ vars.FT_SERVER_LIST || 'https://puresend.madebybaki.com/server.txt' }}
    steps:
      # This job holds a token that can rewrite the repository's releases,
      # so every action in it is pinned to a commit rather than to a tag its
      # owner can move. Dependabot keeps the pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser needs the full history for the changelog

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # A version, once published, never changes. People, the updater and
      # the AUR PKGBUILD have checked its files against their digests; a
      # re-release under the same tag makes every one of those checks lie.
      # A fix is a new version.
      - name: Refuse to replace a published release
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::$TAG is already released and releases are never replaced. Tag a new version instead."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}

      # A wrong server address is only noticed once people have downloaded
      # the binaries it is baked into. server.txt is where the current one
      # is published (docs/DEPLOYMENT.md), so the two disagreeing means one
      # of them is stale — most likely the default above, after the server's
      # key changed. The list being unreachable is not worth failing over.
      - name: Check the server address is the published one
        run: |
          echo "Building release with rendezvous server: $FT_SERVER"
          if ! list="$(curl -fsSL --max-time 20 "$FT_SERVER_LIST")"; then
            echo "::warning::Could not fetch $FT_SERVER_LIST to check the server address against."
            exit 0
          fi
          published="$(printf '%s\n' "$list" | sed 's/#.*//; s/^[[:space:]]*//; s/[[:space:]]*$//')"
          for addr in $(printf '%s' "$FT_SERVER" | tr ',' ' '); do
            if ! printf '%s\n' "$published" | grep -qxF -- "$addr"; then
              echo "::error::$addr is not listed in $FT_SERVER_LIST. Update whichever is stale: the FT_SERVER variable (or the default in this workflow), or server.txt."
              exit 1
            fi
          done

      # The release page carries the version's own section of the changelog.
      # A tag without one is refused: notes written after the fact are notes
      # nobody writes.
      - name: Release notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v v="${TAG#v}" '
            /^## \[/ { if (on) exit; on = index($0, "## [" v "]") == 1; next }
            on
          ' docs/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::docs/CHANGELOG.md has no section for ${TAG#v}. Move the [Unreleased] notes under a [${TAG#v}] heading first."
            exit 1
          fi

      # A tag is a promise that this commit works. Check it before six
      # binaries go out under that promise, not after.
      - name: Vet and test
        env:
          # The client reads both from the environment. A test whose own
          # server is unreachable must fail, not find the production one.
          FT_SERVER: ""
          FT_SERVER_LIST: ""
        run: |
          go vet ./...
          go test -race -short -timeout 15m ./...

      # Signing checksums.txt with minisign is what lets `puresend -update`
      # tell that the list of digests came from whoever holds the key, not
      # merely from whoever can edit the release page. The public half
      # (FT_UPDATE_KEY) is baked into the clients, which from then on refuse
      # any release not signed with the secret half — so the two must be set
      # together, and must belong together. See docs/DEPLOYMENT.md.
      - name: Prepare release signing
        id: sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          FT_UPDATE_KEY: ${{ vars.FT_UPDATE_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ] && [ -z "$FT_UPDATE_KEY" ]; then
            echo "::warning::This release is not signed. Set the MINISIGN_SECRET_KEY secret and the FT_UPDATE_KEY variable to sign it (docs/DEPLOYMENT.md)."
            echo "skip=--skip=sign" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$MINISIGN_SECRET_KEY" ] || [ -z "$FT_UPDATE_KEY" ]; then
            echo "::error::MINISIGN_SECRET_KEY and FT_UPDATE_KEY must be set together."
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          # Clients built with a key that does not match the signer could
          # never update again. Prove the pair before anything is built.
          echo probe > "$RUNNER_TEMP/probe"
          minisign -S -s "$RUNNER_TEMP/minisign.key" -m "$RUNNER_TEMP/probe" </dev/null
          minisign -V -P "$FT_UPDATE_KEY" -m "$RUNNER_TEMP/probe"
          echo "MINISIGN_KEY_FILE=$RUNNER_TEMP/minisign.key" >> "$GITHUB_ENV"
          echo "skip=" >> "$GITHUB_OUTPUT"

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # An exact version, for the same reason the actions are pinned.
          version: "v2.18.2"
          args: release --clean --release-notes=${{ runner.temp }}/notes.md ${{ steps.sign.outputs.skip }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FT_UPDATE_KEY: ${{ vars.FT_UPDATE_KEY }}
